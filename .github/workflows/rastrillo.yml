name: Rastrillo de noticias

on:
  schedule:
    - cron: "23 * * * *"   # cada hora, minuto 23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  rastrillo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar notas
        run: python3 scripts/rastrillo.py
      - name: Prefiltro y sitio
        run: |
          python3 scripts/prefiltro.py 12
          TZ=America/Argentina/Buenos_Aires python3 scripts/espana.py || echo "España falló, sigue el resto"
          python3 scripts/armar_sitio.py
      - name: Guardar
        run: |
          git config user.name "rastrillo-bot"
          git config user.email "rastrillo-bot@users.noreply.github.com"
          git add data/crudo.json data/candidatos.json index.html ayer.html archivo.html archivo
          git add data/espana espana.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Rastrillo: notas nuevas"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
